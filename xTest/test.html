<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Angular Embed POC</title>
  </head>
  <body>
    <h1>Strona hosta</h1>

    <p>Bundle aplikacji AAA ładowany jest po wykonaniu <code>npm run build:baw</code> w <code>apps/aaa</code>.</p>

    <button id="start" onclick="startForm()">Uruchom Angular</button>
    <button onclick="destroyForm()">Zniszcz Angular</button>
    <button onclick="startRequest()">Uruchom formularz wniosku</button>

    <div id="root"></div>

    <script src="../apps/aaa/dist/baw/aaa.js"></script>

    <script>
      let angularInstance = null;
      async function startForm() {
        if (angularInstance) return;
        angularInstance = await AngularForm.init(
          'CUSTOMER',
          document.getElementById('root'),
          { firstName: 'Kamil', lastName: 'Kowalski' },
          { title: 'Dane klienta' },
          { complete: (data) => console.log('Wynik formularza:', data) },
        );
      }

      async function startRequest() {
        if (angularInstance) return;
        angularInstance = await AngularForm.init(
          'REQUEST',
          document.getElementById('root'),
          { requestId: 42, amount: 1500 },
          { currency: 'PLN', allowApproval: true },
          { complete: (data) => console.log('Wynik formularza:', data) },
        );
      }

      function destroyForm() {
        if (!angularInstance) return;

        angularInstance.destroy();
        angularInstance = null;

        console.log('Angular zniszczony');
      }

    </script>
  </body>
</html>
